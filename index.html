.sumbox .t{border-top-color:rgba(var(--acc2-rgb),.55)}

/* الأزرار */
.btn{background:var(--pri);color:var(--onacc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 22px -12px rgba(var(--acc-rgb),.95)}
.btn.sec{background:rgba(var(--acc-rgb),.2);color:var(--accfg);box-shadow:inset 0 0 0 1px var(--gb)}
.btn.dng{background:var(--red2);color:var(--red);box-shadow:none}
.btn.dng2{background:var(--red);color:#fff}
.chip{background:var(--field);border-color:var(--line);color:var(--ink)}
.chip.on{background:var(--pri);color:var(--onacc);border-color:transparent}
.chip.add{background:transparent;color:var(--accfg);border-color:var(--line)}
.tools .chip.add{border:0}

/* الناف والزرار العايم */
.nav{background:var(--nav-bg);border:1px solid var(--gb);
 -webkit-backdrop-filter:blur(calc(var(--blur) + 8px)) saturate(1.8);backdrop-filter:blur(calc(var(--blur) + 8px)) saturate(1.8);
 box-shadow:inset 0 1px 0 var(--hl),0 18px 36px -14px var(--shd)}
.nav button{color:var(--mut)}
.nav button.on{background:var(--pri);color:var(--onacc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.fab button{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--onacc2);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 16px 26px -10px rgba(var(--acc-rgb),.9)}
.selbar{background:rgba(18,16,30,.72);border:1px solid var(--gb);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.row.selr{box-shadow:0 0 0 2px var(--acc2),0 10px 26px -14px var(--shd)}

/* النوافذ المنزلقة */
.ov{background:rgba(10,8,22,.38);-webkit-backdrop-filter:none;backdrop-filter:none}
.sh{background:var(--sheet-bg);color:var(--ink);border:1px solid var(--gb);border-bottom:0;
 -webkit-backdrop-filter:blur(calc(var(--blur) + 14px)) saturate(1.8);backdrop-filter:blur(calc(var(--blur) + 14px)) saturate(1.8);
 box-shadow:inset 0 1px 0 var(--hl),0 -14px 44px rgba(0,0,0,.25)}
.grab{background:var(--line)}
.sh h2,.sec-t{color:var(--ink)}
.sh h2 .i,.sec-t .i,.menu button .i{color:var(--accfg)}
.menu button{border-bottom-color:var(--line);color:var(--ink)}
.menu .red,.menu .red .i{color:var(--red)}
.in{background:var(--field);border:1px solid var(--line);color:var(--ink)}
.in::placeholder,.sb input::placeholder{color:var(--mut);opacity:1}
.in:focus{border-color:var(--acc2);box-shadow:0 0 0 4px rgba(var(--acc2-rgb),.28)}
.sb{color:var(--mut)}
.sb input{color:var(--ink)}
.sb:focus-within{box-shadow:0 0 0 3px rgba(var(--acc2-rgb),.4)}
.sx{color:var(--mut)}
.sx:active{background:rgba(var(--acc-rgb),.25)}
.toast{background:rgba(18,16,30,.82);border:1px solid var(--gb);color:#F5F3FB;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.toast button{color:var(--acc2)}

/* قفل التطبيق */
.lk{background:linear-gradient(rgba(12,10,24,.58),rgba(12,10,24,.58)),radial-gradient(60% 45% at 15% 10%,var(--g2) 0,transparent 100%),radial-gradient(55% 45% at 90% 90%,rgba(var(--acc-rgb),.8) 0,transparent 100%),linear-gradient(165deg,var(--g1),var(--g2) 150%);
 -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.lkb .i.xl{color:var(--acc2)}
.dots i{border-color:var(--acc2)}
.dots i.on{background:var(--acc2)}
.pad button,.pad span{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pad .fn{color:var(--acc2)}

/* شاشة تخصيص الألوان */
.pre{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.pre button{height:62px;border-radius:18px;border:2px solid rgba(255,255,255,.55);display:flex;align-items:flex-end;justify-content:center;padding:5px;font-size:12.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -10px var(--shd)}
.pre button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--field);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink)}
.cp input[type=color]{width:40px;height:40px;border:0;padding:0;border-radius:12px;background:none;cursor:pointer;flex:none}
.cp input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.cp input[type=color]::-webkit-color-swatch{border:2px solid rgba(255,255,255,.7);border-radius:12px}
.cp input[type=color]::-moz-color-swatch{border:2px solid rgba(255,255,255,.7);border-radius:12px}
.rg{margin-bottom:14px}
.rg label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:6px}
.rg label b{color:var(--ink)}
.rg input[type=range]{width:100%;accent-color:var(--acc)}

/* ===== تباين أقوى: نص الهيرو بيتحسب من لون الخلفية الفعلي ===== */
.hero .lbl,.stat{color:var(--hero-mut)}
.hero .big,.stat b,.stat .i{color:var(--hero-ink)}
.hero .big.neg{color:var(--hero-red)}
.rs{font-weight:500}
.lh{font-weight:500}
.nav button{font-weight:700}

/* ===== خلفية متحركة (حركة transform بس، خفيفة على الموبايل) ===== */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;will-change:transform}
.bgfx i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-22vmax;background:radial-gradient(closest-side,rgba(var(--acc-rgb),.55),transparent);animation:bf1 24s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:62vmax;height:62vmax;right:-22vmax;top:18vh;background:radial-gradient(closest-side,rgba(var(--acc2-rgb),.5),transparent);animation:bf2 30s ease-in-out infinite alternate}
.bgfx i:nth-child(3){width:66vmax;height:66vmax;left:-10vmax;bottom:-28vmax;background:radial-gradient(closest-side,var(--g3),transparent);opacity:.8;animation:bf3 36s ease-in-out infinite alternate}
@keyframes bf1{to{transform:translate3d(28vmax,18vmax,0) scale(1.15)}}
@keyframes bf2{to{transform:translate3d(-30vmax,-14vmax,0) scale(.9)}}
@keyframes bf3{to{transform:translate3d(26vmax,-16vmax,0) scale(1.12)}}
.noanim .bgfx{display:none}
.paused .bgfx i{animation-play-state:paused}

/* ===== وضع الأداء التلقائي: القوايم الطويلة (+٤٠ كارت) من غير بلور على كل كارت ===== */
.lite .row,.lite .cl,.lite .qr:not(.bad){-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--lite-bg)}

/* ===== معاينة حية داخل شاشة التخصيص ===== */
.pv{position:sticky;top:0;z-index:3;margin:0 0 16px;padding:12px;border-radius:24px;overflow:hidden;background:var(--bgimg);border:1px solid var(--gb);box-shadow:0 12px 26px -16px var(--shd)}
.pv .hero{padding:12px 16px;margin-bottom:8px;border-radius:20px}
.pv .hero .big{font-size:26px;margin-top:0}
.pv .row{cursor:default;margin-bottom:8px;min-height:56px}
.pv .row:active{transform:none}
.pv .btns{margin-top:0}
.pv .btn{padding:11px 10px;font-size:14px;pointer-events:none}
.cg.c3{grid-template-columns:repeat(3,1fr)}
.cp.c{flex-direction:column;gap:6px;text-align:center;padding:10px 6px;font-size:12.5px}
.cp.one{padding:10px 12px}
.cp.one small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.5}
</style>

<script>
/* ============ الثيم الزجاجي ============ */
const TH_KEY='work_accounts_theme';
const PRESETS=[
 {n:'الصباح',m:'light',g1:'#dbeafe',g2:'#c4b5fd',g3:'#fbcfe8',a:'#5b4bd5',b:'#ec7ab0'},
 {n:'المحيط',m:'dark',g1:'#0b1d3a',g2:'#1d4ed8',g3:'#06b6d4',a:'#3b82f6',b:'#22d3ee'},
 {n:'الغابة',m:'dark',g1:'#06251c',g2:'#0f766e',g3:'#84cc16',a:'#10b981',b:'#a3e635'},
 {n:'الغروب',m:'dark',g1:'#2a0f3d',g2:'#be185d',g3:'#f97316',a:'#f43f5e',b:'#fbbf24'},
 {n:'الورد',m:'light',g1:'#ffe4ec',g2:'#fbcfe8',g3:'#ddd6fe',a:'#db2777',b:'#8b5cf6'},
 {n:'القهوة',m:'dark',g1:'#2a1b13',g2:'#5a3d2b',g3:'#b08a4f',a:'#8a5a3c',b:'#d9b06a'}
];
const thDef=()=>({...PRESETS[0],op:45,bl:18,an:!(navigator.hardwareConcurrency<=4||navigator.deviceMemory<=2)});
let TH=thDef();
try{const t=JSON.parse(localStorage.getItem(TH_KEY));if(t&&typeof t==='object')TH={...TH,...t}}catch(e){}
['g1','g2','g3','a','b'].forEach(k=>{if(!/^#[0-9a-f]{6}$/i.test(TH[k]))TH[k]=thDef()[k]});
TH.m=TH.m==='dark'?'dark':'light';
TH.op=Math.min(90,Math.max(5,+TH.op||45));
TH.bl=Math.min(40,Math.max(0,+TH.bl>=0?+TH.bl:18));
TH.an=!!TH.an;
const hx=h=>{h=String(h).replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0)};
const lum=h=>{const[r,g,b]=hx(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const shade=(h,t)=>{const k=t<0?0:255,p=Math.abs(t);return '#'+hx(h).map(v=>Math.round(v+(k-v)*p).toString(16).padStart(2,'0')).join('')};
const onCol=h=>lum(h)>.45?'#1b1410':'#ffffff';
function applyTheme(){
  const L=TH.m==='light',st=document.documentElement.style,ga=L?TH.op/100:TH.op/100*.5,a=TH.a,b=TH.b;
  const mix=(c1,c2,t)=>{const x=hx(c1),y=hx(c2);return '#'+x.map((q,i)=>Math.round(q+(y[i]-q)*t).toString(16).padStart(2,'0')).join('')};
  const hb=mix(mix(L?mix(TH.g1,'#ffffff',.5):mix(TH.g1,TH.g2,.4),a,.55),b,.3),hd=L;
  const v={
    '--g1':TH.g1,'--g2':TH.g2,'--g3':TH.g3,'--acc':a,'--acc2':b,
    '--acc-rgb':hx(a).join(','),'--acc2-rgb':hx(b).join(','),
    '--onacc':onCol(a),'--onacc2':onCol(b),
    '--accfg':L?(lum(a)>.5?shade(a,-.55):shade(a,-.25)):(lum(a)<.3?shade(a,.55):shade(a,.25)),
    '--ink':L?'#1E1B2B':'#F5F3FB','--mut':L?'rgba(30,27,43,.8)':'rgba(245,243,251,.8)',
    '--hero-ink':hd?'#1E1B2B':'#FFFFFF','--hero-mut':hd?'rgba(30,27,43,.8)':'rgba(255,255,255,.84)','--hero-red':hd?'#B42318':'#FFC2B6',
    '--lite-bg':L?'rgba(255,255,255,'+Math.min(.85,ga+.2).toFixed(3)+')':'rgba(255,255,255,'+(ga+.03).toFixed(3)+')',
    '--line':L?'rgba(30,27,43,.13)':'rgba(255,255,255,.17)',
    '--gb':L?'rgba(255,255,255,.72)':'rgba(255,255,255,.2)',
    '--hl':L?'rgba(255,255,255,.95)':'rgba(255,255,255,.24)',
    '--shd':L?'rgba(40,30,70,.38)':'rgba(0,0,0,.6)',
    '--ga':ga.toFixed(3),'--blur':TH.bl+'px',
    '--bar-bg':L?'rgba(255,255,255,'+(ga*.7).toFixed(3)+')':'rgba(18,16,34,.38)',

    '--sheet-bg':L?'rgba(255,255,255,'+Math.min(.93,.62+ga*.4).toFixed(3)+')':'rgba(22,20,38,.82)',

const rgb2hsl=h=>{let[r,g,b]=hx(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,L=(mx+mn)/2;let H=0,S=0;if(d){S=d/(1-Math.abs(2*L-1));H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H=(H*60+360)%360}return[H,S*100,L*100]};
const hsl2hex=(H,S,L)=>{H=((H%360)+360)%360;S=Math.min(100,Math.max(0,S))/100;L=Math.min(100,Math.max(0,L))/100;const k=n=>(n+H/30)%12,a=S*Math.min(L,1-L),f=n=>L-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')};

function thDerive(hex){

  if(TH.m==='light'){TH.g1=hsl2hex(H,80*k,93);TH.g2=hsl2hex(H+16,72*k,81);TH.g3=hsl2hex(H+55,78*k,87);TH.b=hsl2hex(H+38,80*k,62)}

}

    const sheet=kind==='pays'?'':(r.b?bn(r.b):'الشيت الحالي');
    const hay=norm([txt,r.note||'',amt,Number(amt).toLocaleString('en-US'),r.date,shortDate(r.date),fmtDate(r.date),KN[kind],sheet].join(' '));
    if(toks.every(t=>hay.includes(t)))items.push({kind,r,sheet,amt:Number(amt)||0});
  };
  c.cars.forEach(r=>add('cars',r,r.type||'',r.price));
  c.exps.forEach(r=>add('exps',r,r.desc||'',r.price));
  c.pays.forEach(r=>add('pays',r,r.method||'',r.amount));
  if(!items.length)return `<div class="empty">${ic('search','xl')}<b>مفيش نتايج</b><span>جرّب كلمة تانية أو جزء من الكلمة. البحث بيدوّر في كل الشيتات.</span></div>`;
  items.sort((a,b)=>b.r.date.localeCompare(a.r.date));
  const spent=items.filter(i=>i.kind!=='pays').reduce((t,i)=>t+i.amt,0),got=items.filter(i=>i.kind==='pays').reduce((t,i)=>t+i.amt,0);
  return `<div class="lh"><span style="font-weight:400">${items.length} نتيجة</span><span>${spent?'صرف '+money(spent):''}${spent&&got?' · ':''}${got?'استلام '+money(got):''}</span></div>`
    +items.map(i=>rowHtml(i.kind,i.r,i.sheet)).join('');
}
const mvBtn=(k,r)=>`<button class="ed mv" onclick="event.stopPropagation();moveSheet('${k}','${r.id}')" aria-label="نقل لقسم تاني">${ic('move','s')}</button>`;
const noteHtml=r=>r.note?`<span class="nt">${esc(r.note)}</span>`:'';
function rowHtml(kind,r,tag){
  if(kind==='cars')
    return `<div class="row" onclick="openForm('cars','${r.id}')"><div class="rbadge">${ic('truck')}</div><div class="rt"><b>${esc(r.type||'عربية')}</b><span class="rs">${subLine(r,r.price,tag)}</span>${noteHtml(r)}</div><div class="ra">${money(r.price)}</div><span class="ed">${ic('edit','s')}</span>${mvBtn(kind,r)}</div>`;
  if(kind==='exps')
    return `<div class="row ${r.ok?'done':''}" onclick="openForm('exps','${r.id}')"><button class="ckw" onclick="event.stopPropagation();toggleOk('${r.id}')" aria-label="تمام"><span class="ck ${r.ok?'on':''}">${r.ok?ic('check'):''}</span></button><div class="rt"><b>${esc(r.desc||'منصرف')}</b><span class="rs">${subLine(r,r.price,tag)}</span>${noteHtml(r)}<button type="button" class="gp ${r.got?'on':''}" onclick="event.stopPropagation();toggleGot('${r.id}')">${r.got?ic('check')+' استلمت فلوسها':'لسه ماخدتش فلوسها'}</button></div><div class="ra">${money(r.price)}</div><span class="ed">${ic('edit','s')}</span>${mvBtn(kind,r)}</div>`;
  return `<div class="row" onclick="openForm('pays','${r.id}')"><div class="rbadge rcv">${ic('in')}</div><div class="rt"><b>${esc(r.method||'مستلم')}</b><span class="rs">${subLine(r,r.amount,tag)}</span>${noteHtml(r)}</div><div class="ra rcv">+${money(r.amount)}</div><span class="ed">${ic('edit','s')}</span>${mvBtn(kind,r)}</div>`;
}

/* البنود الظاهرة في التبويب الحالي (بعد الفلتر) */
function baseList(c){const t=view.tab;return t==='pays'?c.pays:c[t].filter(x=>!x.b)}
function visList(c){
  let l=baseList(c);
  if(view.tab==='exps'){const f=view.f||'all';if(f==='nog')l=l.filter(x=>!x.got);else if(f==='got')l=l.filter(x=>x.got)}
  return l;
}
function setF(f){view.f=f;render()}

function selRow(kind,r){
  const on=SEL.has(r.id),amt=r.price??r.amount;
  const title=kind==='cars'?(r.type||'عربية'):kind==='exps'?(r.desc||'منصرف'):(r.method||'مستلم');
  const extra=kind==='exps'?`<span class="rs">${r.got?ic('check','s')+' استلمت فلوسها':'لسه ماخدتش فلوسها'}${r.ok?' · تمام':''}</span>`:'';
  return `<div class="row ${on?'selr':''}" onclick="selTog('${r.id}')"><span class="ck ${on?'on':''}">${on?ic('check'):''}</span><div class="rt"><b>${esc(title)}</b><span class="rs">${fmtDate(r.date)}</span>${extra}${noteHtml(r)}</div><div class="ra ${kind==='pays'?'rcv':''}">${kind==='pays'?'+':''}${money(amt)}</div></div>`;
}

function tabList(c){
  const tab=view.tab;
  const base=baseList(c),list=visList(c);
  let h='';
  if(SEL){
    const all=list.length>0&&list.every(x=>SEL.has(x.id));
    h+=`<div class="selbar"><b>${SEL.size?'محدد '+SEL.size:'اختار البنود'}</b><button class="btn sec sm" onclick="selAll()">${all?'إلغاء الكل':'تحديد الكل'}</button><button class="btn sm" onclick="selCancel()">تم</button></div>`;
  }else{
    h+=`<button class="qbtn" onclick="quickSheet()">${ic('zap')}<span>كتابة سريعة: اكتب أو الصق من المذكرة</span></button>`;
    if(tab!=='pays'){
      const n=c.cars.filter(x=>!x.b).length+c.exps.filter(x=>!x.b).length;
      if(n){
        const tot=sum(c.cars.filter(x=>!x.b))+sum(c.exps.filter(x=>!x.b));
        h+=`<div class="settle"><div class="rt"><b>الشيت الحالي (مفتوح)</b><span class="rs">${n} بند · ${money(tot)}</span></div>
        <button class="ib2" onclick="exportCsv('cur')" aria-label="تصدير Excel">${ic('download')}</button>
        <button class="btn sm" onclick="settleSheet()">${ic('lock','s')} تقفيل الشيت</button></div>`;
      }
    }
  }
  const lbl={cars:'العربيات',exps:'المنصرف',pays:'المستلم'}[tab];
  if(!base.length){
    const ico={cars:'truck',exps:'out',pays:'in'}[tab];
    return h+`<div class="empty">${ic(ico,'xl')}<b>مفيش ${lbl} لسه</b><span>دوس على + عشان تضيف</span></div>`;
  }
  const f=view.f||'all';
  const cntF=k=>k==='all'?base.length:k==='nog'?base.filter(x=>!x.got).length:base.filter(x=>x.got).length;
  h+=`<div class="tools">${tab==='exps'?[['all','الكل'],['nog','لسه ماخدتش'],['got','استلمتها']].map(([k,l])=>`<button type="button" class="chip ${f===k?'on':''}" onclick="setF('${k}')">${l} (${cntF(k)})</button>`).join(''):''}${SEL?'':`<button type="button" class="chip add" style="margin-inline-start:auto" onclick="selStart()">${ic('check','s')} تحديد</button>`}</div>`;
  if(!list.length)return h+`<div class="empty"><b>مفيش بنود في الفلتر ده</b></div>`;
  h+=`<div class="lh"><span style="font-weight:400">${lbl} (${list.length})</span><span>${money(sum(list))}</span></div>`;
  if(tab==='exps'&&f==='all'){
    const nog=list.filter(x=>!x.got);
    if(nog.length)h+=`<div class="lh" style="margin-top:-2px"><span style="font-weight:400;color:#8a5a00">لسه ماخدتش فلوسها (${nog.length})</span><span style="color:#8a5a00">${money(sum(nog))}</span></div>`;
  }
  return h+sorted(list).map(r=>SEL?selRow(tab,r):rowHtml(tab,r)).join('');
}

/* ============ تحديد متعدد ============ */
const selItems=()=>SEL?client()[view.tab].filter(x=>SEL.has(x.id)):[];
function selStart(){SEL=new Set();render()}
function selCancel(){SEL=null;render()}
function selTog(id){if(SEL.has(id))SEL.delete(id);else SEL.add(id);render()}
function selAll(){
  const ids=visList(client()).map(x=>x.id),all=ids.every(i=>SEL.has(i));
  ids.forEach(i=>all?SEL.delete(i):SEL.add(i));render();
}
function selNav(){
  const it=selItems(),n=it.length,d=n?'':' disabled';
  const b=(i,l,fn,cls='')=>`<button class="${cls}" onclick="${fn}"${d}><span class="pill">${ic(i)}</span>${l}</button>`;
  let h='';
  if(view.tab==='exps'){
    const allGot=n&&it.every(x=>x.got),allOk=n&&it.every(x=>x.ok);
    h+=b('check',allGot?'شيل الاستلام':'استلمت فلوسها','selFlag(\'got\')')+b('done',allOk?'شيل تمام':'تمام','selFlag(\'ok\')');
  }
  return h+b('move','نقل','selMove()')+b('trash','حذف','selDel()','red');
}
function selFlag(k){
  const it=selItems();if(!it.length)return;
  const v=!it.every(x=>x[k]);
  it.forEach(x=>x[k]=v);
  SEL=null;render();
  toast(k==='got'?(v?`اتعلّم ${it.length} بند: استلمت فلوسها`:'اتشالت علامة الاستلام'):(v?`اتعلّم ${it.length} بند: تمام`:'اتشالت علامة تمام'));
}
function selDel(){
  const c=client(),k=view.tab,removed=selItems();if(!removed.length)return;
  const ids=new Set(removed.map(x=>x.id));
  c[k]=c[k].filter(x=>!ids.has(x.id));SEL=null;render();
  toast(`اتحذف ${removed.length} بند`,()=>{c[k].push(...removed);render()});
}
let MVB=null;
function selMove(){
  const k=view.tab,items=selItems();if(!items.length)return;
  MVB={to:null};
  const tos=['cars','exps','pays'].filter(x=>x!==k);
  openSheet(`<h2>${ic('move')} نقل ${items.length} بند</h2>
  <div class="sumbox"><div><span>الإجمالي</span><b>${money(sum(items))}</b></div><div><span>حاليًا في</span><span>${KN2[k]}</span></div></div>
  <div class="fld"><label>انقلهم إلى</label><div class="chips">${tos.map(t=>`<button type="button" class="chip" data-to="${t}" onclick="mvbPick('${t}')">${ic(KI[t])} ${KN2[t]}</button>`).join('')}</div></div>
  <div id="mv-f"></div>
  <div class="btns"><button class="btn" id="mv-go" onclick="doBulkMove()" disabled>${ic('check')} اختار القسم الأول</button></div>`);
}
function mvbPick(to){
  MVB.to=to;
  document.querySelectorAll('[data-to]').forEach(e=>e.classList.toggle('on',e.dataset.to===to));
  let f='';
  if(to==='cars')f=`<div class="fld"><label>نوع العربية (لو ما اخترتش هيتحدد من الوصف)</label><div id="w-type">${chipsHtml('type',S.carTypes,'','carTypes')}</div></div>`;
  else if(to==='pays')f=`<div class="fld"><label>نوع التحويل (لو ما اخترتش هيتحدد تلقائي)</label><div id="w-method">${chipsHtml('method',S.methods,'','methods')}</div></div>`;
  let hint='';
  if(view.tab==='pays')hint='المنصرف والعربيات هتدخل في الشيت الحالي المفتوح.';
  else if(to==='pays')hint='لو فيه بنود جوه شيت مقفول، نقلها هيخصمها من إجمالي الشيت ده.';
  $('mv-f').innerHTML=f+(hint?`<p class="hint">${hint}</p>`:'');
  const g=$('mv-go');g.disabled=false;g.innerHTML=`${ic('check')} نقل إلى ${KN2[to]}`;
}
function doBulkMove(){
  const c=client(),k=view.tab,to=MVB&&MVB.to;if(!to)return;
  const items=selItems(),ty=selVal('type'),me=selVal('method'),pairs=[];
  items.forEach(r=>{
    const i=c[k].indexOf(r);if(i<0)return;
    const txt=(k==='cars'?r.type:k==='exps'?r.desc:r.method)||'';
    const amt=r.price??r.amount,keep=(k!=='pays'&&to!=='pays')?(r.b||null):null;
    const n={id:r.id,date:r.date,note:r.note||''};
    if(to==='cars'){n.type=ty||(S.carTypes.includes(txt)?txt:carType(txt));n.price=amt;n.b=keep}
    else if(to==='exps'){n.desc=k==='cars'?txt:'';n.price=amt;n.ok=false;n.got=false;n.b=keep}
    else{n.method=me||(/انستا|إنستا|فودافون/.test(txt)?payMethod(txt):(S.methods[0]||'نقدي'));n.amount=amt}
    c[k].splice(i,1);c[to].push(n);pairs.push([r,n]);
  });
  closeSheet(()=>{
    SEL=null;render();
    toast(`اتنقل ${pairs.length} بند إلى ${KN2[to]}`,()=>{
      pairs.forEach(([r,n])=>{c[to]=c[to].filter(x=>x!==n);c[k].push(r)});render();
    });
  });
}

function sheetsList(c){
  if(!c.batches.length)
    return `<div class="empty">${ic('file','xl')}<b>مفيش شيتات اتقفلت</b><span>لما تنقل الحسابات في Excel دوس "تقفيل الشيت" وسمّيه، وهتلاقيه هنا محفوظ ومش بيتجمع مع الجديد</span></div>`;
  return [...c.batches].reverse().map(b=>{
    const cc=c.cars.filter(x=>x.b===b.id),ee=c.exps.filter(x=>x.b===b.id);

  }).join('');
}

function sheetPage(){
  const c=client(),b=c.batches.find(x=>x.id===view.sid);
  setTop(b.name,{back:1,acts:[['download',`exportCsv('${b.id}')`,'تصدير Excel'],['more',`batchMenu('${b.id}')`,'المزيد']]});

/* ============ اختيارات (chips) ============ */
function chipsHtml(group,list,sel,key){
  return `<div class="chips" data-g="${group}">${list.map(v=>`<button type="button" class="chip ${v===sel?'on':''}" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`).join('')}<button type="button" class="chip add" onclick="newChoice('${group}')">${ic('plus','s')} جديد</button></div>
  <div class="inl" id="inl-${group}" hidden><input class="in" id="nw-${group}" placeholder="اكتب الاسم الجديد" onkeydown="if(event.key==='Enter'){event.preventDefault();addChoice('${key}','${group}')}"><button type="button" class="btn sm" onclick="addChoice('${key}','${group}')">إضافة</button></div>`;
}
function pick(el){el.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
const selVal=g=>{const e=document.querySelector(`[data-g="${g}"] .chip.on`);return e?e.dataset.v:''};
function newChoice(g){const r=$('inl-'+g);r.hidden=!r.hidden;if(!r.hidden)$('nw-'+g).focus()}
function addChoice(key,g){
  const v=$('nw-'+g).value.trim();if(!v)return;
  if(!S[key].includes(v))S[key].push(v);
  save();$('w-'+g).innerHTML=chipsHtml(g,S[key],v,key);
}

/* ============ إضافة / تعديل ============ */
function openForm(kind,id){
  const c=client(),r=id?c[kind].find(x=>x.id===id):null;
  const amtLbl={cars:'سعر العربية',exps:'المبلغ',pays:'المبلغ المستلم'}[kind];
  let f=`<div class="fld"><label>التاريخ</label><input class="in" type="date" id="f-date" value="${r?r.date:today()}"></div>
  <div class="fld"><label>${amtLbl}</label><input class="in big" id="f-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${r?(r.price??r.amount):''}" oninput="this.value=en(this.value)"></div>`;
  if(kind==='cars'){
    if(r&&r.type&&!S.carTypes.includes(r.type))S.carTypes.push(r.type);
    const last=c.cars[c.cars.length-1];
    const sel=r?r.type:((last&&last.type)||S.carTypes[0]);
    f+=`<div class="fld"><label>نوع العربية</label><div id="w-type">${chipsHtml('type',S.carTypes,sel,'carTypes')}</div></div>`;
  }
  if(kind==='exps'){
    const rec=r?[]:[...new Set([...c.exps].reverse().map(x=>(x.desc||'').trim()).filter(d=>d&&d.length<=28))].slice(0,6);
    f+=`<div class="fld"><label>صرفت الحاجات دي في إيه</label><input class="in" id="f-desc" autocomplete="off" placeholder="مثلاً: مواصلات" value="${esc(r?r.desc:'')}">
    ${rec.length?`<div class="chips sm">${rec.map(d=>`<button type="button" class="chip" onclick="$('f-desc').value=this.textContent.trim();$('f-amt').focus()">${esc(d)}</button>`).join('')}</div>`:''}</div>
    <button type="button" class="okrow ${r&&r.ok?'on':''}" id="f-ok" onclick="this.classList.toggle('on')"><span class="ck">${ic('check')}</span><span>تمام (اتنقلت في الشيت)</span></button>
    <button type="button" class="okrow ${r&&r.got?'on':''}" id="f-got" onclick="this.classList.toggle('on')"><span class="ck">${ic('check')}</span><span>استلمت فلوس المنصرف ده</span></button>`;
  }
  if(kind==='pays'){
    if(r&&r.method&&!S.methods.includes(r.method))S.methods.push(r.method);
    const last=c.pays[c.pays.length-1];
    const sel=r?r.method:((last&&last.method)||S.methods[0]);
    f+=`<div class="fld"><label>نوع التحويل</label><div id="w-method">${chipsHtml('method',S.methods,sel,'methods')}</div></div>`;
  }
  f+=`<div class="fld"><label>ملاحظات (اختياري)</label><textarea class="in" id="f-note" rows="2" placeholder="اكتب أي ملاحظة على البند ده">${esc(r?r.note||'':'')}</textarea></div>`;
  f+=`<div class="btns">${r?`<button class="btn dng" onclick="delItem('${kind}','${id}')" aria-label="حذف">${ic('trash')}</button><button class="btn sec mvb" onclick="closeSheet(()=>moveSheet('${kind}','${id}'))" aria-label="نقل لقسم تاني">${ic('move')} نقل</button>`:''}
  <button class="btn" onclick="saveForm('${kind}','${id||''}',false)">${ic('check')} ${r?'حفظ التعديل':'حفظ'}</button>
  ${r?'':`<button class="btn sec" onclick="saveForm('${kind}','',true)">${ic('plus')} حفظ وإضافة تاني</button>`}</div>`;
  openSheet(`<h2>${ic({cars:'truck',exps:'out',pays:'in'}[kind])} ${r?'تعديل':'إضافة'} ${KN[kind]}</h2>`+f);
  if(!r)setTimeout(()=>{const a=$('f-amt');if(a)a.focus()},260);
}

function readAmt(){
  const raw=en($('f-amt').value).replace(/,/g,'').trim();
  const nums=raw.match(/\d+(?:\.\d+)?/g)||[];
  if(!nums.length){toast('اكتب المبلغ');return 0}
  if(nums.length>1||/[^\d.\s]/.test(raw)){toast('خانة المبلغ فيها رقم واحد بس. للصق المذكرة استخدم الكتابة السريعة (زرار الصاعقة فوق)');return 0}
  const v=parseFloat(nums[0]);
  if(!(v>0)||v>100000000){toast('المبلغ غير منطقي، راجعه');return 0}
  return v;
}
function saveForm(kind,id,again){
  const c=client(),amt=readAmt();
  if(!amt){$('f-amt').focus();return}
  const date=$('f-date').value||today();
  const note=$('f-note').value.trim();
  let it=id?c[kind].find(x=>x.id===id):null;
  if(kind==='cars'){
    const type=selVal('type')||S.carTypes[0]||'عربية نقل';
    if(it)Object.assign(it,{date,price:amt,type,note});else c.cars.push({id:uid(),date,type,price:amt,note,b:null});
  }else if(kind==='exps'){
    const desc=$('f-desc').value.trim(),ok=$('f-ok').classList.contains('on'),got=$('f-got').classList.contains('on');
    if(it)Object.assign(it,{date,price:amt,desc,ok,got,note});else c.exps.push({id:uid(),date,price:amt,desc,ok,got,note,b:null});
  }else{
    const method=selVal('method')||S.methods[0]||'نقدي';
    if(it)Object.assign(it,{date,amount:amt,method,note});else c.pays.push({id:uid(),date,amount:amt,method,note});
  }
  save();
  if(again){
    $('f-amt').value='';if($('f-desc'))$('f-desc').value='';$('f-note').value='';if($('f-got'))$('f-got').classList.remove('on');if($('f-ok'))$('f-ok').classList.remove('on');
    $('f-amt').focus();toast('اتضافت، كمّل اللي بعدها');render();
  }else{closeSheet();render();toast(id?'اتعدّل':'اتضافت')}
}

function toggleGot(id){const r=client().exps.find(x=>x.id===id);r.got=!r.got;render();toast(r.got?'اتعلّمت: استلمت فلوسها':'اتشالت العلامة')}

/* ============ نقل سطر لقسم تاني ============ */
let MV=null;
function moveSheet(kind,id){
  const c=client(),r=c[kind].find(x=>x.id===id);if(!r)return;
  const txt=(kind==='cars'?r.type:kind==='exps'?r.desc:r.method)||'';
  MV={kind,id,to:null,txt};
  const tos=['cars','exps','pays'].filter(k=>k!==kind);
  openSheet(`<h2>${ic('move')} نقل لقسم تاني</h2>
  <div class="sumbox"><div><span>${esc(txt||KN[kind])}</span><b>${money(r.price??r.amount)}</b></div><div><span>${fmtDate(r.date)}</span><span>حاليًا في: ${KN2[kind]}</span></div></div>
  <div class="fld"><label>انقله إلى</label><div class="chips">${tos.map(k=>`<button type="button" class="chip" data-to="${k}" onclick="mvPick('${k}')">${ic(KI[k])} ${KN2[k]}</button>`).join('')}</div></div>
  <div id="mv-f"></div>
  <div class="btns"><button class="btn" id="mv-go" onclick="doMove()" disabled>${ic('check')} اختار القسم الأول</button></div>`);
}
function mvPick(to){
  const c=client(),r=c[MV.kind].find(x=>x.id===MV.id),txt=MV.txt;
  MV.to=to;
  document.querySelectorAll('[data-to]').forEach(e=>e.classList.toggle('on',e.dataset.to===to));
  let f='';
  if(to==='cars'){
    const sel=S.carTypes.includes(txt)?txt:carType(txt);
    f=`<div class="fld"><label>نوع العربية</label><div id="w-type">${chipsHtml('type',S.carTypes,sel,'carTypes')}</div></div>`;
  }else if(to==='exps'){
    f=`<div class="fld"><label>صرفت الحاجات دي في إيه</label><input class="in" id="mv-desc" autocomplete="off" placeholder="مثلاً: مواصلات" value="${esc(MV.kind==='cars'?txt:'')}"></div>`;
  }else{
    const last=c.pays[c.pays.length-1];
    const sel=/انستا|إنستا|فودافون/.test(txt)?payMethod(txt):((last&&last.method)||S.methods[0]);
    f=`<div class="fld"><label>نوع التحويل</label><div id="w-method">${chipsHtml('method',S.methods,sel,'methods')}</div></div>`;
  }
  let hint='';
  const bn=r.b&&(c.batches.find(b=>b.id===r.b)||{}).name;
  if(r.b&&to==='pays')hint=`السطر ده جوه شيت مقفول (${esc(bn||'')})، ونقله هيخصمه من إجمالي الشيت ده.`;
  else if(MV.kind==='pays'&&to!=='pays')hint='هيدخل في الشيت الحالي المفتوح.';
  else if(r.b)hint=`هيفضل جوه الشيت المقفول (${esc(bn||'')}).`;
  $('mv-f').innerHTML=f+(hint?`<p class="hint">${hint}</p>`:'');
  const g=$('mv-go');g.disabled=false;g.innerHTML=`${ic('check')} نقل إلى ${KN2[to]}`;
}
function doMove(){
  const c=client(),{kind,id,to}=MV||{};if(!to)return;
  const i=c[kind].findIndex(x=>x.id===id);if(i<0)return;
  const r=c[kind][i],amt=r.price??r.amount,keep=(kind!=='pays'&&to!=='pays')?(r.b||null):null;
  const n={id:r.id,date:r.date,note:r.note||''};
  if(to==='cars'){n.type=selVal('type')||S.carTypes[0]||'عربية نقل';n.price=amt;n.b=keep}
  else if(to==='exps'){n.desc=$('mv-desc').value.trim();n.price=amt;n.ok=false;n.got=false;n.b=keep}
  else{n.method=selVal('method')||S.methods[0]||'نقدي';n.amount=amt}
  c[kind].splice(i,1);c[to].push(n);
  closeSheet(()=>{
    render();
    toast('اتنقل إلى '+KN2[to],()=>{c[to]=c[to].filter(x=>x!==n);c[kind].splice(Math.min(i,c[kind].length),0,r);render()});
  });
}

/* ============ المرتب (منفصل عن العملاء) ============ */
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mLabel=m=>{const p=String(m||'').split('-');return p.length===2?`${MN[+p[1]-1]||''} ${p[0]}`:String(m||'')};
const nextMonth=m=>{const[y,mo]=m.split('-').map(Number);return mo===12?`${y+1}-01`:`${y}-${pad(mo+1)}`};
/* كل شهر: المرتب + اللي اتاخد. اللي فضل بيتحسب في الشهر اللي بعده تلقائي */
function salCalc(){
  const ms=[...S.salary.months].sort((a,b)=>a.m.localeCompare(b.m));
  let carry=0,amount=0,taken=0;
  const rows=ms.map(r=>{
    const a=Number(r.amount)||0,k=Number(r.taken)||0,due=carry+a,rem=due-k;
    const o={r,carry,due,taken:k,rem};carry=rem;amount+=a;taken+=k;return o;
  });
  return{rows,amount,taken,rem:amount-taken};
}
const salCarryFor=(m,id)=>{const l=salCalc().rows.filter(o=>o.r.id!==id&&o.r.m<m);return l.length?l[l.length-1].rem:0};
function salaryCard(){
  const t=salCalc(),n=t.rows.length;
  const sub=n?`${n} شهر · أخدت ${money(t.taken)} من ${money(t.amount)}`:'سجّل مرتب كل شهر وعلّم اللي أخدته';
  const rem=!n?'':t.rem>0?`<div class="rem amb"><small>لسه</small>${money(t.rem)}</div>`:t.rem<0?`<div class="rem neg"><small>زيادة</small>${money(-t.rem)}</div>`:`<div class="rem"><small>اتاخد</small>✓</div>`;
  return `<div class="cl" onclick="go('salary')"><div class="cbadge">${ic('wallet')}</div><div class="rt"><b>المرتب</b><span class="rs">${sub}</span></div>${rem}</div>`;
}
function salRow(o){
  const{r,carry,taken,rem}=o,full=taken>0&&rem<=0;
  const st=taken<=0?'لسه ماخدتش':full?(rem<0?'اتاخد كله وزيادة':'اتاخد كله'):'أخدت جزء';
  const pill=rem>0?`<div class="rem amb"><small>باقي</small>${money(rem)}</div>`:rem<0?`<div class="rem neg"><small>زيادة</small>${money(-rem)}</div>`:`<div class="rem"><small>${taken>0?'اتاخد':'—'}</small>${taken>0?'✓':'0'}</div>`;
  return `<div class="row ${full?'done':''}" onclick="salaryForm('${r.id}')"><button class="ckw" onclick="event.stopPropagation();salToggle('${r.id}')" aria-label="أخدته كله"><span class="ck ${full?'on':''}">${full?ic('check'):''}</span></button>
  <div class="rt"><b>${esc(mLabel(r.m))}</b><span class="rs">المرتب ${money(r.amount)}${carry?` · ${carry>0?'مرحّل':'سلفة'} ${money(Math.abs(carry))}`:''}</span><span class="rs">${st}${taken>0?' · أخدت '+money(taken):''}${rem>0&&taken>0?' · بيترحّل '+money(rem):''}</span>${noteHtml(r)}</div>${pill}</div>`;
}
function salaryPage(){
  setTop('المرتب',{back:1});
  const t=salCalc(),neg=t.rem<0;
  let h=`<div class="hero"><div class="lbl">${neg?'واخد زيادة عن المرتب':'لسه ماخدتوش من المرتب'}</div><div class="big ${neg?'neg':''}">${money(Math.abs(t.rem))}</div>
  <div class="stats"><div class="stat">${ic('wallet','s')}<b>${money(t.amount)}</b>إجمالي المرتب</div><div class="stat">${ic('check','s')}<b>${money(t.taken)}</b>اللي أخدته</div><div class="stat">${ic('file','s')}<b>${t.rows.length}</b>شهور</div></div></div>`;
  if(!t.rows.length)h+=`<div class="empty">${ic('wallet','xl')}<b>لسه مفيش مرتب متسجل</b><span>سجّل الشهر وفلوسه، وعلّم اللي أخدته كله أو جزء منه. اللي يفضل بيترحّل للشهر اللي بعده.</span><button class="btn" onclick="salaryForm()">${ic('plus')} تسجيل شهر</button></div>`;
  else h+=`<div class="lh"><span style="font-weight:400">الشهور (${t.rows.length})</span><span>${money(t.amount)}</span></div>`+t.rows.slice().reverse().map(salRow).join('');
  $('app').innerHTML=h;$('nav').innerHTML='';
  $('fab').innerHTML=`<button class="home" onclick="salaryForm()" aria-label="تسجيل شهر">${ic('plus')}</button>`;
}
function salToggle(id){
  const o=salCalc().rows.find(x=>x.r.id===id);if(!o)return;
  const r=o.r,prev=r.taken;
  if(o.rem>0){r.taken=(Number(r.taken)||0)+o.rem}else{r.taken=0}
  render();
  toast(o.rem>0?'اتعلّم: أخدته كله':'اتشالت علامة الأخذ',()=>{r.taken=prev;render()});
}
const salVal=(id,zeroOk)=>{
  const raw=en($(id).value).replace(/,/g,'').trim();
  if(!raw)return zeroOk?0:NaN;
  const n=raw.match(/\d+(?:\.\d+)?/g)||[];
  if(n.length!==1||/[^\d.\s]/.test(raw))return NaN;
  return parseFloat(n[0]);
};
function salUpd(){
  const m=$('s-m').value,id=$('s-id').value;
  const a=salVal('s-amt',true),k=salVal('s-tk',true);
  const c=/^\d{4}-\d{2}$/.test(m)?salCarryFor(m,id):0;
  const A=isNaN(a)?0:a,K=isNaN(k)?0:k,rem=c+A-K;
  $('s-sum').innerHTML=(c?`<div><span>${c>0?'مرحّل من الشهور اللي قبل':'سلفة من الشهور اللي قبل'}</span><b>${money(Math.abs(c))}</b></div>`:'')
    +`<div><span>مرتب الشهر</span><b>${money(A)}</b></div><div><span>أخدت</span><b>${money(K)}</b></div>`
    +`<div class="t"><span>${rem>0?'الباقي (بيترحّل للشهر اللي بعده)':rem<0?'زيادة عن المرتب':'خلص'}</span><b>${money(Math.abs(rem))}</b></div>`;
}
function salFull(){const m=$('s-m').value,a=salVal('s-amt',true);$('s-tk').value=(/^\d{4}-\d{2}$/.test(m)?salCarryFor(m,$('s-id').value):0)+(isNaN(a)?0:a);salUpd()}
function salNone(){$('s-tk').value='0';salUpd()}
function salaryForm(id){
  const ms=S.salary.months,r=id?ms.find(x=>x.id===id):null;
  const last=[...ms].sort((a,b)=>a.m.localeCompare(b.m)).pop();
  const m=r?r.m:(last?nextMonth(last.m):today().slice(0,7));
  const amt=r?r.amount:(last?last.amount:'');
  openSheet(`<h2>${ic('wallet')} ${r?'تعديل مرتب الشهر':'تسجيل شهر'}</h2><input type="hidden" id="s-id" value="${r?r.id:''}">
  <div class="fld"><label>الشهر</label><input class="in" type="month" id="s-m" value="${m}" oninput="salUpd()"></div>
  <div class="fld"><label>مرتب الشهر</label><input class="in big" id="s-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${amt}" oninput="this.value=en(this.value);salUpd()"></div>
  <div class="fld"><label>أخدت منه كام</label><input class="in big" id="s-tk" inputmode="decimal" autocomplete="off" placeholder="0" value="${r?(r.taken||''):''}" oninput="this.value=en(this.value);salUpd()">
    <div class="chips sm"><button type="button" class="chip" onclick="salFull()">${ic('check')} أخدته كله</button><button type="button" class="chip" onclick="salNone()">لسه ماخدتش</button></div></div>
  <div class="sumbox" id="s-sum"></div>
  <div class="fld"><label>ملاحظات (اختياري)</label><textarea class="in" id="s-note" rows="2" placeholder="أي ملاحظة على الشهر ده">${esc(r?r.note||'':'')}</textarea></div>
  <div class="btns">${r?`<button class="btn dng" onclick="salDel('${r.id}')" aria-label="حذف">${ic('trash')}</button>`:''}<button class="btn" onclick="salSave()">${ic('check')} ${r?'حفظ التعديل':'حفظ'}</button></div>`);
  salUpd();
  if(!r)setTimeout(()=>{const a=$('s-amt');if(a&&!a.value)a.focus()},260);
}
function salSave(){
  const id=$('s-id').value,m=$('s-m').value,a=salVal('s-amt',false),k=salVal('s-tk',true),note=$('s-note').value.trim();
  if(!/^\d{4}-\d{2}$/.test(m)){toast('اختار الشهر');return}
  if(isNaN(a)||!(a>0)||a>100000000){toast('اكتب مبلغ المرتب (رقم واحد بس)');$('s-amt').focus();return}
  if(isNaN(k)||k<0||k>100000000){toast('خانة "أخدت كام" فيها رقم غلط');$('s-tk').focus();return}
  if(S.salary.months.some(x=>x.m===m&&x.id!==id)){toast('الشهر ده متسجل قبل كده، عدّله من القايمة');return}
  const it=id?S.salary.months.find(x=>x.id===id):null;
  if(it)Object.assign(it,{m,amount:a,taken:k,note});else S.salary.months.push({id:uid(),m,amount:a,taken:k,note});
  closeSheet(()=>{render();toast(id?'اتعدّل':'اتسجّل الشهر')});
}
function salDel(id){
  const ms=S.salary.months,i=ms.findIndex(x=>x.id===id),it=ms[i];if(!it)return;
  ms.splice(i,1);
  closeSheet(()=>{render();toast('اتحذف الشهر',()=>{ms.splice(Math.min(i,ms.length),0,it);render()})});
}

/* ============ كتابة سريعة ============ */
function carType(d){return /مون/.test(d)?'عربية مون':/سوزوكي/.test(d)?'سوزوكي':'عربية نقل'}
function payMethod(s){return /انستا|إنستا/.test(s)?'انستاباي':/فودافون/.test(s)?'فودافون كاش':'نقدي'}
function parseLine(raw){
  let s=en(raw).replace(/[\[\]]/g,' ').trim();
  if(!s||/تقفيل/.test(s))return null;
  let date=today();
  const dm=s.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(dm){
    const d=+dm[1],m=+dm[2];let y=dm[3]?+dm[3]:new Date().getFullYear();if(y<100)y+=2000;
    if(d>=1&&d<=31&&m>=1&&m<=12)date=`${y}-${pad(m)}-${pad(d)}`;
    s=s.replace(dm[0],' ');
  }
  const am=s.match(/(\d+(?:\.\d+)?)\s*(الف|ألف|الاف|ألاف|ج|جنيه)?/);
  if(!am)return null;
  const amount=parseFloat(am[1])*(/^(ال|أل)/.test(am[2]||'')?1000:1);
  if(!amount||amount>100000000)return null;
  s=s.replace(am[0],' ');
  const desc=s.split(/\s+/).filter(w=>w&&!['تم','صرف','استلام','يوم','م'].includes(w)).join(' ');
  let kind='exps';
  if(/استلام/.test(raw))kind='pays';
  else if(/^عربي[هة](\s|$|\()/.test(desc))kind='cars';
  return{kind,date,amount,desc,type:carType(desc),method:payMethod(s),raw};
}

/* مخزن داخلي (IndexedDB) */
let idbP=null;
function idb(){
  if(!idbP)idbP=new Promise((res,rej)=>{
    try{
      const q=indexedDB.open('accounts-db',1);
      q.onupgradeneeded=()=>{q.result.createObjectStore('kv');q.result.createObjectStore('snaps')};
      q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
    }catch(e){rej(e)}
  });
  return idbP;
}
function idbDo(store,mode,fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const t=db.transaction(store,mode);let out;
    try{out=fn(t.objectStore(store))}catch(e){rej(e);return}
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  }));
}
/* نسخة داخلية: واحدة لكل يوم (آخر 14 يوم) + نسخ "قبل الاسترجاع" (آخر 5). مش بتتكتب لو الداتا فاضية */
function snapshot(key){
  if(!hasData(S))return Promise.resolve();
  return idbDo('snaps','readwrite',s=>s.put({key,at:Date.now(),clients:S.clients.length,items:cnt(S),data:JSON.stringify(S)},key)).then(prune).catch(()=>{});
}
async function prune(){
  const keys=await idbDo('snaps','readonly',s=>s.getAllKeys());
  const del=[...keys.filter(k=>/^\d{4}-/.test(k)).sort().reverse().slice(14),...keys.filter(k=>k.startsWith('pre-')).sort().reverse().slice(5)];
  if(del.length)await idbDo('snaps','readwrite',s=>{del.forEach(k=>s.delete(k))});
}
const listSnaps=()=>idbDo('snaps','readonly',s=>s.getAll()).then(a=>(a||[]).sort((x,y)=>y.at-x.at)).catch(()=>[]);

async function hashPin(pin,salt){
  const s=salt+':'+pin;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'f'+h;
}
let PAD=null,LOCKED=false,BIOA=false,fails=0,waitUntil=0,hiddenAt=0;
const BIO=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.NativeBiometric;
let BIOBUSY=false,BIOERR='';
const b64=u8=>btoa(String.fromCharCode(...new Uint8Array(u8)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
/* بصمة التطبيق الأصلي (Capacitor) */
async function bioNative(){try{const b=BIO();if(!b)return false;const r=await b.isAvailable();return !!(r&&r.isAvailable)}catch(e){return false}}
/* بصمة المتصفح (WebAuthn): بتشتغل من رابط https أو localhost والموبايل عليه بصمة متسجّلة */
async function bioWeb(){
  try{return !!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}
}
async function bioOK(){return (await bioNative())||(await bioWeb())}
async function bioEnroll(){
  BIOERR='';BIOBUSY=true;
  try{
    if(await bioNative())return await bioAskNative('تفعيل فتح التطبيق بالبصمة');
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'حسابات الشغل'},user:{id:rnd(16),name:'work-accounts',displayName:'حسابات الشغل'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    LK.cid=b64(c.rawId);saveLK();return true;
  }catch(e){BIOERR=(e&&e.name)||'';return false}
  finally{BIOBUSY=false;hiddenAt=0}
}
async function bioAskNative(reason){
  try{await BIO().verifyIdentity({reason,title:'حسابات الشغل',subtitle:reason,description:'',negativeButtonText:'استخدم الرقم'});return true}catch(e){return false}
}
async function bioAsk(reason){
  BIOBUSY=true;
  try{
    if(await bioNative())return await bioAskNative(reason);
    if(!LK||!LK.cid)return false;
    await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(LK.cid),transports:['internal']}],userVerification:'required',timeout:60000}});
    return true;
  }catch(e){return false}
  finally{BIOBUSY=false;hiddenAt=0}
}
function pinPad(o){PAD={v:'',err:'',busy:false,...o};drawPad()}
function padClose(){PAD=null;$('lk').hidden=true;$('lk').innerHTML=''}
function drawPad(){
  if(!PAD)return;
  const el=$('lk');el.hidden=false;
  const dots=[0,1,2,3].map(i=>`<i class="${i<PAD.v.length?'on':''}"></i>`).join('');
  const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" onclick="padKey('${n}')">${n}</button>`).join('');
  const left=PAD.bio?`<button type="button" class="fn" onclick="lkBio()">بصمة</button>`:PAD.cancel?`<button type="button" class="fn" onclick="PAD.cancel()">إلغاء</button>`:'<span></span>';
  el.innerHTML=`<div class="lkb">${ic('lock','xl')}<h2>${esc(PAD.title)}</h2><p class="${PAD.err?'er':''}">${esc(PAD.err||PAD.sub||'')}</p>
  <div class="dots ${PAD.shake?'shk':''}">${dots}</div>
  <div class="pad">${keys}${left}<button type="button" onclick="padKey('0')">0</button><button type="button" class="fn" onclick="padKey('<')" aria-label="مسح">${ic('delete')}</button></div></div>`;
  PAD.shake=false;
}
async function padKey(k){
  const cur=PAD;if(!cur||cur.busy)return;
  if(k==='<'){cur.v=cur.v.slice(0,-1);cur.err='';drawPad();return}
  if(cur.v.length>=4)return;
  cur.v+=k;cur.err='';drawPad();
  if(cur.v.length<4)return;
  cur.busy=true;
  const pin=cur.v,r=await cur.onPin(pin);
  if(PAD!==cur)return;
  cur.busy=false;cur.v='';
  if(r!==true){cur.err=r||'الرقم غلط';cur.shake=true}
  drawPad();
}
addEventListener('keydown',e=>{
  if(!PAD||$('lk').hidden)return;
  if(/^\d$/.test(e.key))padKey(e.key);else if(e.key==='Backspace')padKey('<');
});
async function pinCheck(p){
  const left=waitUntil-Date.now();
  if(left>0)return `استنى ${Math.ceil(left/1000)} ثانية وجرب تاني`;
  if(await hashPin(p,LK.s)===LK.h){fails=0;return true}
  if(++fails>=5){fails=0;waitUntil=Date.now()+30000;return 'غلطت كتير، استنى ٣٠ ثانية'}
  return 'الرقم غلط';
}
function lockNow(){
  if(!LK||LOCKED)return;
  LOCKED=true;
  pinPad({unlock:true,title:'التطبيق مقفول',sub:'اكتب الرقم السري',onPin:async p=>{
    const r=await pinCheck(p);
    if(r===true){LOCKED=false;padClose();return true}
    return r;
  }});
  if(LK.bio)bioOK().then(v=>{BIOA=v;if(v&&LOCKED&&PAD&&PAD.unlock){PAD.bio=true;drawPad();lkBio()}});
}
async function lkBio(){
  if(!LOCKED)return;
  if(await bioAsk('افتح التطبيق')){LOCKED=false;padClose()}
}
document.addEventListener('visibilitychange',()=>{
  if(BIOBUSY)return;
  if(document.hidden){hiddenAt=Date.now();return}
  if(LK&&!LOCKED&&hiddenAt&&Date.now()-hiddenAt>=(LK.d??30)*1000)lockNow();
});
function lkSetup(){
  let first='';
  const step1=()=>pinPad({title:'اختار رقم سري',sub:'٤ أرقام',cancel:padClose,onPin:async p=>{first=p;step2();return true}});
  const step2=()=>pinPad({title:'اكتب الرقم تاني',sub:'للتأكيد',cancel:step1,onPin:async p=>{
    if(p!==first)return 'مش متطابق، جرب تاني';
    const salt=uid()+uid();
    LK={s:salt,h:await hashPin(p,salt),d:LK?LK.d:30,bio:LK?!!LK.bio:false,cid:LK?LK.cid:undefined};saveLK();
    padClose();toast('القفل اشتغل');lockSheet();return true;
  }});
  step1();
}
function lkVerify(title,ok){
  pinPad({title,sub:'اكتب الرقم الحالي',cancel:padClose,onPin:async p=>{
    const r=await pinCheck(p);
    if(r===true){padClose();ok();return true}
    return r;
  }});
}
function lkDelay(n){LK.d=n;saveLK();lockSheet()}
async function lkBioToggle(){
  if(LK.bio){LK.bio=false;saveLK();lockSheet();return}
  if(await bioEnroll()){LK.bio=true;saveLK();lockSheet();toast('اتفعّلت البصمة')}
  else toast(BIOERR==='NotAllowedError'||BIOERR===''?'البصمة اتلغت أو ما اتأكدتش، جرب تاني':'المتصفح منع البصمة هنا. افتح التطبيق من رابط https وجرب تاني');
}
async function lockSheet(){
  if(!LK){
    openSheet(`<h2>${ic('lock')} قفل التطبيق</h2>
    <p class="hint">رقم سري من ٤ أرقام بيتطلب كل ما تفتح التطبيق. ده قفل للشاشة بس، مش تشفير للداتا.</p>
    <p class="hint"><b style="color:var(--red)">مهم:</b> لو نسيت الرقم مفيش طريقة تفتح بيها من جوه التطبيق. الحل الوحيد تمسح بيانات التطبيق من إعدادات الموبايل وترجّع من نسخة احتياطية، فخد نسخة قبل ما تفعّل.</p>
    <div class="btns"><button class="btn sec" onclick="downloadBackup()">${ic('download')} نسخة احتياطية دلوقتي</button><button class="btn" onclick="lkSetup()">${ic('lock')} تفعيل القفل</button></div>`);
    return;
  }
  const ba=await bioOK();BIOA=ba;
  const dl=[[0,'فورًا'],[30,'٣٠ ثانية'],[120,'دقيقتين'],[600,'١٠ دقايق']];
  openSheet(`<h2>${ic('lock')} قفل التطبيق</h2>
  <div class="sumbox"><div><span>الحالة</span><b style="color:var(--green)">مفعّل</b></div></div>
  <div class="fld"><label>يتقفل لما تسيب التطبيق لمدة</label><div class="chips">${dl.map(([n,l])=>`<button type="button" class="chip ${(LK.d??30)===n?'on':''}" onclick="lkDelay(${n})">${l}</button>`).join('')}</div></div>
  ${ba?`<button type="button" class="okrow ${LK.bio?'on':''}" onclick="lkBioToggle()"><span class="ck">${ic('check')}</span><span>افتح بالبصمة كمان</span></button>`:`<p class="hint">${window.isSecureContext?'مفيش بصمة متسجّلة على الموبايل. سجّل بصمة من إعدادات الموبايل (الأمان) وارجع جرّب.':'البصمة محتاجة التطبيق يتفتح من رابط https (مش ملف على الجهاز).'}</p>`}
  <div class="btns"><button class="btn sec" onclick="lkVerify('تغيير الرقم',lkSetup)">تغيير الرقم</button><button class="btn dng" onclick="lkVerify('إلغاء القفل',()=>{LK=null;saveLK();toast('اتلغى القفل');lockSheet()})">إلغاء القفل</button></div>`);
}
if(LK)lockNow();

render();
dirReady=loadDir();
dirReady.then(()=>{render();return autoBackup()}).then(checkEmpty);
</script>
</body>
</html>
